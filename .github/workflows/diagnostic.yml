name: Maquina Viral Scheduler Diagnostic

on:
  push:
    paths:
      - '.github/workflows/diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate scheduler endpoint and automation health
        shell: bash
        env:
          CRON_URL_TOKEN: ${{ secrets.CRON_URL_TOKEN }}
          SCHEDULER_URL: https://maquina-viral.vercel.app/api/schedule/run?limit=1
          HEALTH_URL: https://maquina-viral.vercel.app/api/automation/health
        run: |
          set -euo pipefail

          if [ -z "${CRON_URL_TOKEN:-}" ]; then
            echo "::error::CRON_URL_TOKEN is missing."
            exit 1
          fi

          scheduler_body="$(mktemp)"
          scheduler_code="$(curl \
            --silent --show-error --location \
            --output "$scheduler_body" \
            --write-out '%{http_code}' \
            --max-time 90 \
            --request POST "$SCHEDULER_URL" \
            --header "Authorization: Bearer $CRON_URL_TOKEN" \
            --header 'Accept: application/json')"

          echo "Scheduler HTTP: $scheduler_code"
          jq '{success, source, claimed, results_count: ((.results // []) | length), error}' "$scheduler_body"

          if [ "$scheduler_code" -lt 200 ] || [ "$scheduler_code" -ge 300 ]; then
            echo "::error::Scheduler endpoint failed."
            exit 1
          fi

          health_body="$(mktemp)"
          health_code="$(curl \
            --silent --show-error --location \
            --output "$health_body" \
            --write-out '%{http_code}' \
            --max-time 60 \
            --request GET "$HEALTH_URL" \
            --header "Authorization: Bearer $CRON_URL_TOKEN" \
            --header 'Accept: application/json')"

          echo "Automation health HTTP: $health_code"
          jq '{hasDatabase, hasWorkerUrl, hasR2, hasRenderProvider, renderProvider, hasGroqKey, hasCronToken, hasCronUrlToken, error}' "$health_body"

          if [ "$health_code" -lt 200 ] || [ "$health_code" -ge 300 ]; then
            echo "::error::Automation health endpoint failed."
            exit 1
          fi
