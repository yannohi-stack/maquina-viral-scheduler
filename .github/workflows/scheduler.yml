name: Maquina Viral External Scheduler

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Run every 5 minutes, offset from minute 00
    # to avoid the busiest part of the hour.
    - cron: '2-57/5 * * * *'

concurrency:
  group: maquina-viral-external-scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Maquina Viral scheduler
        shell: bash
        env:
          SCHEDULER_URL: https://maquina-viral.vercel.app/api/schedule/run?limit=10
          CRON_URL_TOKEN: ${{ secrets.CRON_URL_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_URL_TOKEN:-}" ]; then
            echo "::error::CRON_URL_TOKEN is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 90 \
            --request POST "$SCHEDULER_URL" \
            --header "Authorization: Bearer $CRON_URL_TOKEN" \
            --header "Accept: application/json")"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Maquina Viral scheduler returned HTTP $http_code."
            exit 1
          fi

          echo "Scheduler call completed with HTTP $http_code."
